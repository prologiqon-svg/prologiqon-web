<html lang="sk">
<head>

    .camera-hero {
      background: #071725;
      color: #fff;
      padding: 60px 24px 75px;
    }

    .camera-inner {
      max-width: 1120px;
      margin: 0 auto;
    }

    .camera-label {
      color: #C5F35D;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 13px;
      font-weight: 700;
    }

    .camera-hero h1 {
      max-width: 850px;
      font-size: clamp(36px, 5vw, 58px);
      line-height: 1.12;
      margin: 18px 0;
    }

    .camera-hero p {
      max-width: 760px;
      color: #d5dee5;
      font-size: 18px;
      line-height: 1.8;
    }

    .iq-lime {
      color: #C5F35D;
    }

    .camera-button {
      display: inline-block;
      margin-top: 18px;
      padding: 14px 22px;
      border: 0;
      border-radius: 6px;
      background: #C5F35D;
      color: #071725;
      text-decoration: none;
      font-weight: 700;
      cursor: pointer;
      font: inherit;
    }

    .camera-button:hover {
      filter: brightness(0.95);
    }

    .camera-photo-section {
      background: #071725;
      padding: 0 24px 55px;
    }

    .camera-photo {
      max-width: 1120px;
      margin: 0 auto;
      height: clamp(240px, 42vw, 480px);
      overflow: hidden;
      border-radius: 12px;
      border: 1px solid rgba(197, 243, 93, 0.25);
    }

    .camera-photo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 58%;
    }

    .camera-section {
      padding: 65px 24px;
      background: #fff;
      color: #071725;
    }

    .camera-section.alt {
      background: #f3f6f8;
    }

    .camera-section h2 {
      font-size: clamp(28px, 4vw, 40px);
      margin: 0 0 16px;
    }

    .camera-intro {
      max-width: 780px;
      color: #52616d;
      line-height: 1.8;
      margin-bottom: 30px;
    }

    .camera-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(235px, 1fr));
      gap: 20px;
      margin-top: 32px;
    }

    .camera-card {
      border: 1px solid #dce4e9;
      border-radius: 12px;
      padding: 26px;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .camera-card h3 {
      font-size: 22px;
      margin: 0 0 12px;
    }

    .camera-card p {
      color: #52616d;
      line-height: 1.75;
      margin: 0 0 14px;
    }

    .camera-card ul {
      color: #52616d;
      line-height: 1.8;
      padding-left: 0;
      margin: 0 0 20px;
      list-style: none;
    }

    .camera-card li {
      margin-bottom: 5px;
    }

    .camera-card li::before {
      content: "✓";
      display: inline-grid;
      place-items: center;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #C5F35D;
      color: #071725;
      font-size: 10px;
      font-weight: 800;
      margin-right: 9px;
    }

    .camera-price {
      border-top: 1px solid #dce4e9;
      padding-top: 18px;
      margin-top: auto;
      width: 100%;
    }

    .camera-price span {
      display: block;
      color: #52616d;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .camera-price strong {
      display: block;
      font-size: 19px;
      color: #071725;
    }

    .camera-note {
      margin-top: 28px;
      padding: 22px;
      background: #edf2e4;
      border-left: 4px solid #C5F35D;
      border-radius: 6px;
      color: #33414b;
      line-height: 1.8;
    }

    .camera-cta {
      background: #071725;
      color: #fff;
      padding: 65px 24px;
      text-align: center;
    }

    .camera-cta h2 {
      font-size: clamp(28px, 4vw, 40px);
      margin: 0 0 15px;
    }

    .camera-cta p {
      max-width: 720px;
      margin: 0 auto;
      color: #d5dee5;
      line-height: 1.8;
    }

    .camera-footer {
      background: #071725;
      color: #d5dee5;
      padding: 24px;
      text-align: center;
      font-size: 14px;
    }

    .camera-footer a {
      color: #C5F35D;
      text-decoration: none;
    }
