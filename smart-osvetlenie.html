<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071725">

  <title>IQ Cube – Inteligentné osvetlenie | PrologIQon</title>
  <meta name="description" content="IQ Cube od PrologIQon: inteligentné osvetlenie s ovládaním cez mobil, svetelnými scénami, časovými plánmi a automatizáciou. Martin a okolie.">

  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="https://prologiqon.sk/favicon-32x32.png?v=2">

  <style>
    /* ROZBAĽOVACIA PONUKA SMART DOMÁCNOSŤ */
    .smart-nav-dropdown {
      position: relative;
    }

    .smart-nav-toggle {
      appearance: none;
      -webkit-appearance: none;
      display: inline-block;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: #C5F35D;
      font: inherit;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
    }

    .smart-nav-toggle::after {
      content: " ▾";
      font-size: 12px;
    }

    .smart-nav-toggle[aria-expanded="true"]::after {
      content: " ▴";
    }

    .smart-nav-submenu {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      z-index: 10000;
      min-width: 245px;
      padding: 8px;
      margin-top: 10px;
      background: #0d2031;
      border: 1px solid rgba(197, 243, 93, 0.35);
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      flex-direction: column;
      gap: 2px;
    }

    .smart-nav-submenu[hidden] {
      display: none !important;
    }

    .smart-nav-submenu:not([hidden]) {
      display: flex;
    }

    .smart-nav-submenu a {
      display: block;
      padding: 11px 13px;
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      line-height: 1.4;
      border-radius: 5px;
      white-space: nowrap;
    }

    .smart-nav-submenu a:hover,
    .smart-nav-submenu a:focus {
      background: rgba(197, 243, 93, 0.12);
      color: #C5F35D;
    }

    @media (max-width: 768px) {
      .smart-nav-dropdown {
        width: 100%;
      }

      .smart-nav-toggle {
        display: block;
        width: 100%;
        padding: 12px 0;
        text-align: left;
      }

      .smart-nav-submenu {
        position: static;
        min-width: 0;
        width: 100%;
        margin-top: 0;
        margin-bottom: 8px;
        box-sizing: border-box;
        box-shadow: none;
      }

      .smart-nav-submenu a {
        white-space: normal;
      }
    }

    .camera-hero {
      background: #071725;
      color: #fff;
      padding: 60px 24px 75px;
    }

    .camera-inner {
      max-width: 1120px;
      margin: 0 auto;
    }

    .camera-label {
      color: #C5F35D;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 13px;
      font-weight: 700;
    }

    .camera-hero h1 {
      max-width: 850px;
      font-size: clamp(36px, 5vw, 58px);
      line-height: 1.12;
      margin: 18px 0;
    }

    .camera-hero p {
      max-width: 760px;
      color: #d5dee5;
      font-size: 18px;
      line-height: 1.8;
    }

    .iq-lime {
      color: #C5F35D;
    }

    .camera-button {
      display: inline-block;
      margin-top: 18px;
      padding: 14px 22px;
      border: 0;
      border-radius: 6px;
      background: #C5F35D;
      color: #071725;
      text-decoration: none;
      font-weight: 700;
      cursor: pointer;
      font: inherit;
    }

    .camera-button:hover {
      filter: brightness(0.95);
    }

    .camera-photo-section {
      background: #071725;
      padding: 0 24px 55px;
    }

    .camera-photo {
      max-width: 1120px;
      margin: 0 auto;
      height: clamp(240px, 42vw, 480px);
      overflow: hidden;
      border-radius: 12px;
      border: 1px solid rgba(197, 243, 93, 0.25);
    }

    .camera-photo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 58%;
    }

    .camera-section {
      padding: 65px 24px;
      background: #fff;
      color: #071725;
    }

    .camera-section.alt {
      background: #f3f6f8;
    }

    .camera-section h2 {
      font-size: clamp(28px, 4vw, 40px);
      margin: 0 0 16px;
    }

    .camera-intro {
      max-width: 780px;
      color: #52616d;
      line-height: 1.8;
      margin-bottom: 30px;
    }

    .camera-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(235px, 1fr));
      gap: 20px;
      margin-top: 32px;
    }

    .camera-card {
      border: 1px solid #dce4e9;
      border-radius: 12px;
      padding: 26px;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .camera-card h3 {
      font-size: 22px;
      margin: 0 0 12px;
    }

    .camera-card p {
      color: #52616d;
      line-height: 1.75;
      margin: 0 0 14px;
    }

    .camera-card ul {
      color: #52616d;
      line-height: 1.8;
      padding-left: 0;
      margin: 0 0 20px;
      list-style: none;
    }

    .camera-card li {
      margin-bottom: 5px;
    }

    .camera-card li::before {
      content: "✓";
      display: inline-grid;
      place-items: center;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #C5F35D;
      color: #071725;
      font-size: 10px;
      font-weight: 800;
      margin-right: 9px;
    }

    .camera-price {
      border-top: 1px solid #dce4e9;
      padding-top: 18px;
      margin-top: auto;
      width: 100%;
    }

    .camera-price span {
      display: block;
      color: #52616d;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .camera-price strong {
      display: block;
      font-size: 19px;
      color: #071725;
    }

    .camera-note {
      margin-top: 28px;
      padding: 22px;
      background: #edf2e4;
      border-left: 4px solid #C5F35D;
      border-radius: 6px;
      color: #33414b;
      line-height: 1.8;
    }

    .camera-cta {
      background: #071725;
      color: #fff;
      padding: 65px 24px;
      text-align: center;
    }

    .camera-cta h2 {
      font-size: clamp(28px, 4vw, 40px);
      margin: 0 0 15px;
    }

    .camera-cta p {
      max-width: 720px;
      margin: 0 auto;
      color: #d5dee5;
      line-height: 1.8;
    }

    .camera-footer {
      background: #071725;
      color: #d5dee5;
      padding: 24px;
      text-align: center;
      font-size: 14px;
    }

    .camera-footer a {
      color: #C5F35D;
      text-decoration: none;
    }

    /* Dopytový formulár */
    .camera-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      padding: 20px;
      overflow-y: auto;
      background: rgba(3, 12, 20, 0.82);
      align-items: center;
      justify-content: center;
    }

    .camera-modal.is-open {
      display: flex;
    }

    .camera-modal-panel {
      position: relative;
      width: 100%;
      max-width: 620px;
      max-height: 92vh;
      overflow-y: auto;
      padding: 30px;
      background: #fff;
      color: #071725;
      border-radius: 12px;
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.3);
    }

    .camera-modal-panel h2 {
      margin: 0 40px 10px 0;
      font-size: 28px;
    }

    .camera-modal-panel > p {
      color: #52616d;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    .camera-modal-close {
      position: absolute;
      top: 12px;
      right: 14px;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 6px;
      background: #f0f3f5;
      color: #071725;
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
    }

    .camera-form {
      display: grid;
      gap: 15px;
    }

    .camera-form label {
      display: block;
      margin-bottom: 6px;
      color: #071725;
      font-size: 14px;
      font-weight: 700;
    }

    .camera-form input:not([type="checkbox"]),
    .camera-form textarea {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 12px 13px;
      border: 1px solid #cbd5dc;
      border-radius: 6px;
      background: #fff;
      color: #071725;
      font: inherit;
    }

    .camera-form input[readonly] {
      background: #f3f6f8;
    }

    .camera-form textarea {
      min-height: 100px;
      resize: vertical;
    }

    .camera-consent {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      color: #52616d;
      font-size: 13px;
      line-height: 1.6;
    }

    .camera-consent input {
      margin-top: 4px;
      flex-shrink: 0;
    }

    .camera-consent label {
      margin: 0;
      color: #52616d;
      font-weight: 400;
    }

    .camera-consent a {
      color: #071725;
      text-decoration: underline;
    }

    .camera-form-submit {
      width: 100%;
      margin-top: 4px;
      padding: 14px 20px;
      border: 0;
      border-radius: 6px;
      background: #C5F35D;
      color: #071725;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
    }

    .camera-form-submit:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .camera-form-status {
      display: none;
      padding: 12px 14px;
      border-radius: 6px;
      line-height: 1.6;
      font-size: 14px;
    }

    .camera-form-status.is-visible {
      display: block;
    }

    .camera-form-status.success {
      background: #edf7df;
      color: #25420c;
    }

    .camera-form-status.error {
      background: #fff0f0;
      color: #8b1e1e;
    }

    @media (max-width: 600px) {
      .camera-hero {
        padding: 45px 20px 38px;
      }

      .camera-photo-section {
        padding: 0 20px 40px;
      }

      .camera-photo {
        height: 250px;
        border-radius: 8px;
      }

      .camera-section {
        padding: 45px 20px;
      }

      .camera-card {
        padding: 22px;
      }

      .camera-modal {
        padding: 10px;
        align-items: flex-start;
      }

      .camera-modal-panel {
        padding: 24px 18px;
        margin: 10px 0;
        max-height: none;
      }
    }
  </style>
</head>
